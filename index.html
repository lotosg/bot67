<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crypto Clicker</title>
    <style>
        body {
            background-color: #1c1c1e;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            user-select: none; 
        }
        h1 { font-size: 24px; margin-bottom: 10px; }
        #score { font-size: 48px; font-weight: bold; color: #f39c12; }
        #click-btn {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            background: radial-gradient(circle, #f39c12, #d35400);
            border: none;
            margin-top: 30px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(243, 156, 18, 0.5);
            transition: transform 0.1s;
        }
        #click-btn:active { transform: scale(0.95); }
        .save-btn {
            margin-top: 50px;
            padding: 10px 20px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <h1>Монеты</h1>
    <div id="score">0</div>
    <button id="click-btn"></button>
    <button class="save-btn" onclick="sendData()">Сохранить прогресс</button>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
        const tg = window.Telegram.WebApp;
        tg.expand(); // Раскрыть на весь экран

        let score = 0;
        const scoreEl = document.getElementById('score');
        const btn = document.getElementById('click-btn');

        // Логика клика
        btn.addEventListener('click', () => {
            score++;
            scoreEl.innerText = score;
            
            // Вибрация при клике (работает в Telegram)
            if (tg.HapticFeedback) {
                tg.HapticFeedback.impactOccurred('light');
            }
        });

        // Отправка данных боту
        function sendData() {
            // Отправляем данные в бота в виде строки JSON
            const data = JSON.stringify({ score: score });
            tg.sendData(data); 
            tg.close(); // Закрыть окно после сохранения
        }

        // Получение данных от бота (если нужно инициализировать счет)
        // В этом примере мы берем старт с 0, но можно получать из initData
    </script>
</body>
</html>
